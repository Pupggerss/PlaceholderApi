name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    name: Automatic Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          # Find latest semantic version tag.
          LATEST=$(
            git tag -l 'v*.*.*' |
            sed 's/^v//' |
            grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' |
            sort -V |
            tail -n 1 || true
          )

          if [[ -z "$LATEST" ]]; then
            LATEST="0.0.0"
          fi

          IFS='.' read -r MAJOR MINOR PATCH <<< "$LATEST"

          # Look at commits since the previous release.
          if [[ "$LATEST" == "0.0.0" ]]; then
            COMMITS=$(git log --format='%s%n%b')
          else
            COMMITS=$(git log "v${LATEST}..HEAD" --format='%s%n%b')
          fi

          # Determine bump level.
          if echo "$COMMITS" | grep -qE 'release:|^[a-zA-Z]+(\([^)]*\))?!:'; then
            NEW_VERSION="$((MAJOR + 1)).0.0"
            BUMP="major"

          elif echo "$COMMITS" | grep -qE '^feat(\([^)]*\))?:'; then
            NEW_VERSION="${MAJOR}.$((MINOR + 1)).0"
            BUMP="minor"

          elif echo "$COMMITS" | grep -qE '^(fix|perf|refactor|revert)(\([^)]*\))?:'; then
            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
            BUMP="patch"

          else
            echo "No release-worthy commits found."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          NEW_TAG="v${NEW_VERSION}"

          echo "Latest: $LATEST"
          echo "Bump:   $BUMP"
          echo "New:    $NEW_TAG"

          echo "latest=$LATEST" >> "$GITHUB_OUTPUT"
          echo "version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$NEW_TAG" >> "$GITHUB_OUTPUT"
          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Create tag
        if: steps.version.outputs.skip != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a \
            "${{ steps.version.outputs.tag }}" \
            -m "Release ${{ steps.version.outputs.tag }}"

          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create \
            "${{ steps.version.outputs.tag }}" \
            --title "${{ steps.version.outputs.tag }}" \
            --generate-notes
